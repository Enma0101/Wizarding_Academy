{% extends 'layout/base.html' %}

{% block title %}Asignar Curso - Wizarding Academy Hub{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Asignar Curso a Profesor</h2>
    
    <form id="asignarCursoForm" method="POST" action="{{ url_for('asignar_curso') }}">
        <div class="form-group">
            <label for="dni_profesor">DNI Profesor:</label>
            <input type="text" id="dni_profesor" name="dni_profesor" placeholder="Ingrese DNI..." required autofocus>
            <p id="profNotFound" class="error-message" style="display: none;">Profesor no encontrado.</p>
        </div>

        <div class="form-group">
            <label for="nombre_profesor">Nombre Profesor:</label>
            <input type="text" id="nombre_profesor" name="nombre_profesor" placeholder="Se cargará automáticamente..." readonly>
        </div>

        <div class="form-group">
            <label for="categoria">Categoría de Curso:</label>
            <select id="categoria" name="categoria" required>
                <option value="">Seleccione una categoría</option>
                {% for categoria in categorias %}
                    <option value="{{ categoria.id_categoria }}">{{ categoria.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="curso">Curso:</label>
            <select id="curso" name="id_curso" required>
                <option value="">Seleccione un curso</option>
            </select>
        </div>

        <input type="hidden" id="id_profesor" name="id_profesor">
        
        <div class="button-group">
            <button type="submit" class="btn">Asignar Curso</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Regresar</a>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function() {
    $('#dni_profesor').on('input', function() {
        var dni = $(this).val();
        if (dni.length >= 4) {
            $.get('/get_profesor_by_dni/' + dni, function(data) {
                if (data.nombre_completo) {
                    $('#nombre_profesor').val(data.nombre_completo);
                    $('#id_profesor').val(data.id_profesor);
                    $('#profNotFound').hide();
                } else {
                    $('#nombre_profesor').val('');
                    $('#id_profesor').val('');
                    $('#profNotFound').show();
                }
            });
        } else {
            $('#nombre_profesor').val('');
            $('#id_profesor').val('');
            $('#profNotFound').hide();
        }
    });

    $('#categoria').change(function() {
        var categoriaId = $(this).val();
        if (categoriaId) {
            $.get('/get_cursos_by_categoria/' + categoriaId, function(data) {
                var cursoSelect = $('#curso');
                cursoSelect.empty();
                cursoSelect.append('<option value="">Seleccione un curso</option>');
                $.each(data.cursos, function(i, curso) {
                    cursoSelect.append($('<option></option>').val(curso.id_curso).text(curso.nombre_curso));
                });
            });
        } else {
            $('#curso').empty().append('<option value="">Seleccione un curso</option>');
        }
    });
});
</script>
{% endblock %}
