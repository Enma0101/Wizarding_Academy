{% extends 'layout/base.html' %}

{% block title %}Registrar Matrícula - Wizarding Academy Hub{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Registro de Matrícula</h2>
    
    <form method="POST">
        <div class="form-group">
            <label for="dni_estudiante">DNI Estudiante:</label>
            <input type="text" id="dni_estudiante" name="dni_estudiante" placeholder="Ingrese DNI..." required autofocus>
        </div>

        <div class="form-group">
            <label for="nombre_estudiante">Nombre Estudiante:</label>
            <input type="text" id="nombre_estudiante" name="nombre_estudiante" placeholder="Se cargará automáticamente..." readonly>
        </div>

        <div class="form-group">
            <label for="id_categoria">Categoría:</label>
            <select id="id_categoria" name="id_categoria" required>
                <option value="" disabled selected>Seleccione una categoría</option>
                {% for categoria in categorias %}
                    <option value="{{ categoria.id_categoria }}">{{ categoria.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="id_curso">Curso:</label>
            <select id="id_curso" name="id_curso" required>
                <option value="" disabled selected>Seleccione un curso</option>
                {% for curso in cursos %}
                    <option value="{{ curso.id_curso }}">{{ curso.nombre_curso }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="fecha_matricula">Fecha de Matrícula:</label>
            <input type="date" id="fecha_matricula" name="fecha_matricula" required>
        </div>

        <div class="button-group">
            <button type="submit" class="btn">Registrar Matrícula</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Regresar</a>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function() {
    $('#id_categoria').change(function() {
        var categoria_id = $(this).val();
        if (categoria_id != "") {
            $.get('/get_courses/' + categoria_id, function(response) {
                $('#id_curso').empty().append('<option value="" disabled selected>Seleccione un curso</option>');
                $.each(response, function(index, curso) {
                    $('#id_curso').append('<option value="' + curso.id_curso + '">' + curso.nombre_curso + '</option>');
                });
            });
        }
    });

    $('#dni_estudiante').on('input', function() {
        var dniEstudiante = this.value.trim();
        if (dniEstudiante.length >= 4) {
            $.get(`/get_student_name_by_dni/${dniEstudiante}`, function(data) {
                if (data.nombre_completo) {
                    $('#nombre_estudiante').val(data.nombre_completo);
                } else {
                    $('#nombre_estudiante').val('');
                }
            });
        }
    });
    
    // Set default date to today
    if(!$('#fecha_matricula').val()){
        $('#fecha_matricula').val(new Date().toISOString().split('T')[0]);
    }
});
</script>
{% endblock %}
