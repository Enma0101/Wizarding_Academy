{% extends 'layout/base.html' %}

{% block title %}Editar Curso - Wizarding Academy Hub{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Editar Curso</h2>
    <form action="{{ url_for('edit_curso', id_curso=curso['id_curso']) }}" method="post">
        <div class="form-group">
            <label for="nombre_curso">Nombre del Curso:</label>
            <input type="text" id="nombre_curso" name="nombre_curso" value="{{ curso['nombre_curso'] }}" required autofocus>
        </div>
        <div class="form-group">
            <label for="descripcion">Descripción:</label>
            <textarea id="descripcion" name="descripcion" required>{{ curso['descripcion'] }}</textarea>
        </div>
        
        <input type="hidden" name="id_categoria" value="{{ curso['id_categoria'] }}">
        
        <div class="button-group">
            <button type="submit" class="btn">Actualizar</button>
            <a href="{{ url_for('cursos', id_categoria=curso['id_categoria']) }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
