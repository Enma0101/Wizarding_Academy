{% extends 'layout/base.html' %}

{% block title %}Buscar Estudiante - Wizarding Academy Hub{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Buscar Estudiante</h2>
    
    <form action="{{ url_for('buscar_estudiante') }}" method="POST">
        <div class="form-group">
            <label for="dni_estudiante">DNI del Estudiante:</label>
            <input type="text" id="dni_estudiante" name="dni_estudiante" placeholder="Ingrese el DNI para buscar..." required autofocus>
            <p id="notFoundMsg" class="error-message" style="display: none;">Estudiante no encontrado.</p>
        </div>
        
        <div class="form-group">
            <label for="nombre_estudiante">Nombre del Estudiante:</label>
            <input type="text" id="nombre_estudiante" name="nombre_estudiante" placeholder="Aparecerá aquí..." readonly>
        </div>

        <input type="hidden" id="id_estudiante" name="id_estudiante">
        
        <div class="button-group">
            <button type="submit" class="btn">Generar Reporte</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Regresar</a>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function() {
        $('#dni_estudiante').on('input', function() {
            var dni = $(this).val();
            if (dni.length >= 4) {
                $.get('/get_estudiante_by_dni/' + dni, function(data) {
                    if (data.nombre_completo) {
                        $('#nombre_estudiante').val(data.nombre_completo);
                        $('#id_estudiante').val(data.id_estudiante);
                        $('#notFoundMsg').hide();
                    } else {
                        $('#nombre_estudiante').val('');
                        $('#id_estudiante').val('');
                        $('#notFoundMsg').show();
                    }
                }).fail(function() {
                    $('#nombre_estudiante').val('');
                    $('#id_estudiante').val('');
                    $('#notFoundMsg').show();
                });
            } else {
                $('#nombre_estudiante').val('');
                $('#id_estudiante').val('');
                $('#notFoundMsg').hide();
            }
        });
    });
</script>
{% endblock %}
