{% extends 'layout/base.html' %}

{% block title %}Agregar Curso - Wizarding Academy Hub{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Agregar Nuevo Curso</h2>
    <form action="{{ url_for('add_curso', id_categoria=id_categoria) }}" method="post">
        <div class="form-group">
            <label for="nombre_curso">Nombre del Curso:</label>
            <input type="text" id="nombre_curso" name="nombre_curso" placeholder="Ej: Pociones Avanzadas" required autofocus>
        </div>
        <div class="form-group">
            <label for="descripcion">Descripción del Curso:</label>
            <textarea id="descripcion" name="descripcion" placeholder="Describa brevemente el contenido del curso..." required></textarea>
        </div>
        <div class="button-group">
            <button type="submit" class="btn">Agregar</button>
            <a href="{{ url_for('cursos', id_categoria=id_categoria) }}" class="btn btn-secondary">Volver</a>
        </div>
    </form>
</div>
{% endblock %}
