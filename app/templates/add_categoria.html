{% extends 'layout/base.html' %}

{% block title %}Agregar Categoría - Wizarding Academy Hub{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Agregar Nueva Categoría</h2>
    <form action="{{ url_for('add_categoria') }}" method="post">
        <div class="form-group">
            <label for="nombre">Nombre de la Categoría:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: Hechizos de Defensa" required autofocus>
        </div>
        <div class="button-group">
            <button type="submit" class="btn">Agregar</button>
            <a href="{{ url_for('categorias') }}" class="btn btn-secondary">Volver</a>
        </div>
    </form>
</div>
{% endblock %}
