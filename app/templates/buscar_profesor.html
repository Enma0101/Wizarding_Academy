{% extends 'layout/base.html' %}

{% block title %}Buscar Profesor - Wizarding Academy Hub{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Buscar Profesor</h2>

    <form action="{{ url_for('generar_reporte_profesor') }}" method="POST">
        <div class="form-group">
            <label for="dni_profesor">DNI del Profesor:</label>
            <input type="text" id="dni_profesor" name="dni_profesor" placeholder="Ingrese el DNI para buscar..." required autofocus>
            <p id="notFoundMsg" class="error-message" style="display: none;">Profesor no encontrado.</p>
        </div>
        
        <div class="form-group">
            <label for="nombre_profesor">Nombre del Profesor:</label>
            <input type="text" id="nombre_profesor" name="nombre_profesor" placeholder="Aparecerá aquí..." readonly>
        </div>

        <input type="hidden" id="id_profesor" name="id_profesor">
        
        <div class="button-group">
            <button type="submit" class="btn">Generar Reporte</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Regresar</a>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function() {
        $('#dni_profesor').on('input', function() {
            var dni = $(this).val();
            if (dni.length >= 4) {
                $.get('/get_profesor_by_dni/' + dni, function(data) {
                    if (data.nombre_completo) {
                        $('#nombre_profesor').val(data.nombre_completo);
                        $('#id_profesor').val(data.id_profesor);
                        $('#notFoundMsg').hide();
                    } else {
                        $('#nombre_profesor').val('');
                        $('#id_profesor').val('');
                        $('#notFoundMsg').show();
                    }
                }).fail(function() {
                    $('#nombre_profesor').val('');
                    $('#id_profesor').val('');
                    $('#notFoundMsg').show();
                });
            } else {
                $('#nombre_profesor').val('');
                $('#id_profesor').val('');
                $('#notFoundMsg').hide();
            }
        });
    });
</script>
{% endblock %}
